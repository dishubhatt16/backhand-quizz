
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCA Brain Battle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🧠 BCA Brain Battle</h1>
        <p>Challenge your knowledge!</p>
    </header>

    <main class="container">
        <h2>Select Difficulty</h2>

        <div class="levels">
            <button onclick="startQuiz('Basic')">Basic</button>
            <button onclick="startQuiz('Medium')">Medium</button>
            <button onclick="startQuiz('Hard')">Hard</button>
        </div>

        <section id="quiz-section" hidden>
            <h2 id="quiz-title"></h2>
            <p id="timer">Time: 60 seconds</p>
            <p id="question-number"></p>
            <h3 id="question"></h3>
            <div id="options"></div>

            <p id="feedback"></p>

            <div class="navigation">
                <button id="back-btn" onclick="previousQuestion()">Back</button>
                <button id="next-btn" onclick="nextQuestion()">Next</button>
            </div>
        </section>

        <section id="result-section" hidden>
            <h2>Quiz Results 🎉</h2>
            <p id="score"></p>
            <p id="percentage"></p>
            <button onclick="location.reload()">Play Again</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
